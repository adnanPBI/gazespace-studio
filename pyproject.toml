[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gazespace"
version = "0.2.2"
description = "Local-first Windows gaze tracking, eye/pupil detection, calibration and workspace mapping"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "src/gazespace/assets/fonts/LICENSE-DejaVu.txt"]
authors = [{name = "GazeSpace Reference Implementation"}]
dependencies = ["numpy>=1.26,<2", "opencv-contrib-python>=4.8,<4.12", "scipy>=1.11,<2", "Pillow>=10,<13"]

[project.optional-dependencies]
face = ["mediapipe==0.10.21", "jax>=0.4.30,<0.8", "jaxlib>=0.4.30,<0.8"]
desktop = ["PySide6>=6.7,<7"]
depth = ["pyrealsense2>=2.55,<3"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
basler = ["pypylon>=4.2,<26.6"]
packaging = ["pyinstaller>=6.9"]
test = ["pytest>=8,<10", "pytest-cov>=5", "pytest-qt>=4.4", "httpx>=0.27,<1"]
full = ["mediapipe==0.10.21", "jax>=0.4.30,<0.8", "jaxlib>=0.4.30,<0.8", "PySide6>=6.7,<7", "fastapi>=0.110,<1", "uvicorn>=0.27,<1"]

[project.scripts]
gazespace = "gazespace.cli:main"
gazespace-studio = "gazespace.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gazespace = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.md"]

[tool.setuptools.data-files]
"share/gazespace" = ["README.md", "LICENSE"]
"share/gazespace/docs" = ["docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
